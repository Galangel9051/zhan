# 数据路径不受启动时工作目录影响。
listen: 127.0.0.1:12345
# 留空使用固定数据目录：源码运行使用仓库 data/；二进制使用安装目录 data/。
# 安装在 bin/ 下的二进制使用上一级目录的 data/。
# 如需自定义，建议统一设置 ZHAN_DATA_DIR 的绝对路径（Docker 也支持）。
data_dir: ""
# 默认不限目录，使用服务器账户的文件系统权限；可在导入窗口自由浏览选择。
allowed_roots: []
# 如需限定范围，可改为：
# allowed_roots:
#   - /opt/projects
# 通过 HTTPS 访问时设为 true。反向代理需保持 Host。
secure_cookies: false
session_hours: 12
# 默认所有任务全局串行；同一 Stack 和同一 Git 工作区始终互斥。
workers: 1
task_timeout_minutes: 30
log_retention_days: 30
max_log_mb: 20
# 构建或部署失败后自动重试：首次等待 retry_base_seconds，之后每次翻倍，
# 封顶 retry_max_seconds，最多重试 retry_max_attempts 次。
# 重试会重复失败的操作（重新构建仍只重新构建）；如果远程已有更新的 Commit，
# 则改为拉取并部署，以便拾取新提交的修复。新 Commit 不受旧 Commit 的退避影响。
retry_base_seconds: 60
retry_max_seconds: 3600
retry_max_attempts: 5
# 如需固定间隔而非指数退避，填这个列表（例如 [300, 900]）；一旦填写就忽略上面三项。
retry_delays_seconds: []
